services:
  # The Node.js Server (Web Dashboard & Websockets)
  - type: web
    name: coalmine-hq-dashboard
    env: node
    buildCommand: npm install
    startCommand: npm run start:server
    envVars:
      - key: NODE_ENV
        value: production
      - key: PYTHON_SERVICE_URL
        fromService:
          type: web
          name: coalmine-ai-service
          envVarKey: RENDER_EXTERNAL_URL

  # The Python Microservice (Groq AI & OCR)
  - type: web
    name: coalmine-ai-service
    env: python
    rootDir: ocr_service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false
